<nav>
    <a href="index.html" class="logo">Jzone motoshop</a>

<div class="login-box">
    <h2>Login to Your Account</h2>
    
    <form action="index.html">
        <input type="email" placeholder="Email Address">
        <input type="password" placeholder="Password">
        <button type="submit" class="btn" style="width: 100%; margin-bottom: 15px;">Login as Customer</button>
    </form>

    <div style="text-align: center; margin: 15px 0; color: #888; font-size: 12px;">--- DEMO LOGINS ---</div>

    <form action="admin-dashboard.html">
        <button type="submit" class="btn btn-admin" style="width: 100%; margin-bottom: 10px;">Login as Admin</button>
    </form>
    
    <form action="super-dashboard.html">
        <button type="submit" class="btn btn-super" style="width: 100%;">Login as Super Admin</button>
    </form>

    <div class="signup-link">
        <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
        <p style="margin-top:6px;"><a href="#">Forgot Password?</a></p>
    </div>
</div>
